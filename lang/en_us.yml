tpm:
  help_msg: |-
    §6§l━━━ §eTP Manager §6§l━━━
    §7Commands:
    §bTeleport§r
      §f{0} posc <x> <y> <z> §8- §7Teleport to a position in the current dimension
      §f{0} posd <dimension> <x> <y> <z> §8- §7Teleport to a position in another dimension
      §f{0} ask <player> §8- §7Request teleport to another player §8(§f{tpa}§8)
      §f{0} askhere <player> §8- §7Request another player to teleport to you §8(§f{tph}§8)
      §f{0} accept §8/ §f{0} reject §8/ §f{0} cancel §8- §7Accept / reject / cancel a teleport request
    §bWarp Points§r
      §f{0} warp <point> §8- §7Teleport to a warp point
      §f{0} warps list [page] §8- §7List warp points §8(§fl§8)
      §f{0} warps search <keyword> [page] §8- §7Search warp points §8(§fse§8)
      §f{0} warps add <point> <x> <y> <z> <dimension> §8- §7Add / set a warp point
      §f{0} warps addhere <point> §8- §7Add / set a warp point at your current position
      §f{0} warps remove <point> §8- §7Remove a warp point
      §f{0} warps rename <point> <new_name> §8- §7Rename a warp point
      §f{0} warps disown <point> §8- §7Disown a warp point
      §f{0} warps alias <alias> <original> §8- §7Create an alias for a warp point
      §f{0} warps rmalias <alias> §8- §7Remove a warp point alias
    §bCategories§r
      §f{0} categories add <name> <prefix> §8- §7Create a category
      §f{0} categories remove <name> §8- §7Remove a category §8(§frm§8)
      §f{0} categories list <category> [page] §8- §7List warp points in a category §8(§fl§8)
      §f{0} categories listc [page] §8- §7List all categories §8(§flc§8)
      §f{0} categories searchc <keyword> [page] §8- §7Search categories §8(§fsc§8)
      §f{0} categories search <category> <name> [page] §8- §7Search warp points in a category §8(§fse§8)
      §f{0} categories padd <category> <name> <x> <y> <z> <dimension> §8- §7Add / set a warp point in a category
      §f{0} categories paddhere <category> <name> §8- §7Add a warp point here in a category
      §f{0} categories rename <old> <new> §8- §7Rename a category
      §f{0} categories redef <category> <new_prefix> §8- §7Change a category prefix
      §f{0} categories premove <category> <point> §8- §7Remove a warp point from a category §8(§fprm§8)
      §f{0} categories pmove <category> <point> <target_category> §8- §7Move a warp point to another category §8(§fpmv§8)
      §f{0} categories tag <warp_point> <category> §8- §7Manually tag a warp point into a category (multiple allowed)
      §f{0} categories rmtag <warp_point> §8- §7Remove all manual category tags from a warp point
    §8Tip: §7[page] is optional; §f<argument> §7is required.
