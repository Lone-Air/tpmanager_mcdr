tpm:
  help_msg: |-
    §6§l━━━ §eTP Manager §6§l━━━
    §7常用指令：
    §b传送§r
      §f{0} posc <x> <y> <z> §8- §7传送到当前维度的指定坐标
      §f{0} posd <维度> <x> <y> <z> §8- §7传送到指定维度的坐标
      §f{0} ask <玩家> §8- §7请求传送到其他玩家 §8(§f{tpa}§8)
      §f{0} askhere <玩家> §8- §7请求其他玩家传送到你 §8(§f{tph}§8)
      §f{0} accept §8/ §f{0} reject §8/ §f{0} cancel §8- §7处理 / 拒绝 / 取消传送请求
    §b传送点§r
      §f{0} warp <坐标点> §8- §7传送到指定坐标点
      §f{0} warps list [页] §8- §7列出坐标点 §8(§fl§8)
      §f{0} warps search <关键词> [页] §8- §7搜索坐标点 §8(§fse§8)
      §f{0} warps add <坐标点> <x> <y> <z> <维度> §8- §7添加 / 设置坐标点
      §f{0} warps addhere <坐标点> §8- §7在当前位置添加 / 设置坐标点
      §f{0} warps remove <坐标点> §8- §7删除坐标点
      §f{0} warps rename <坐标点> <新名称> §8- §7重命名坐标点
      §f{0} warps disown <坐标点> §8- §7解除坐标点所有权
      §f{0} warps alias <别名> <原坐标点> §8- §7创建坐标点别名
      §f{0} warps rmalias <别名> §8- §7删除坐标点别名
    §b分类§r
      §f{0} categories add <名称> <前缀> §8- §7创建分类
      §f{0} categories remove <名称> §8- §7删除分类 §8(§frm§8)
      §f{0} categories list <分类> [页] §8- §7列出分类中的坐标点 §8(§fl§8)
      §f{0} categories listc [页] §8- §7列出所有分类 §8(§flc§8)
      §f{0} categories searchc <关键词> [页] §8- §7搜索分类 §8(§fsc§8)
      §f{0} categories search <分类> <名称> [页] §8- §7搜索分类中的坐标点 §8(§fse§8)
      §f{0} categories padd <分类> <名称> <x> <y> <z> <维度> §8- §7在分类中添加 / 设置坐标点
      §f{0} categories paddhere <分类> <名称> §8- §7在当前位置添加分类坐标点
      §f{0} categories rename <旧名称> <新名称> §8- §7重命名分类
      §f{0} categories redef <分类> <新前缀> §8- §7修改分类前缀
      §f{0} categories premove <分类> <坐标点> §8- §7删除分类中的坐标点 §8(§fprm§8)
      §f{0} categories pmove <分类> <坐标点> <目标分类> §8- §7移动坐标点到另一个分类 §8(§fpmv§8)
      §f{0} categories tag <坐标点> <分类> §8- §7手动将坐标点标记到指定分类（可多个）
      §f{0} categories rmtag <坐标点> §8- §7移除坐标点的所有手动分类标记
    §8提示：§7命令中的 §f[页] §7为可选参数；§f<参数> §7为必填参数。
