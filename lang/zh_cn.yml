tpm:
  help_msg: |-
    {0} help :显示这条帮助信息
    {0} posc <x> <y> <z> :传送到当前维度下的指定坐标
    {0} posd <d> <x> <y> <z> :传送到指定维度下的指定坐标
    {0} ask <玩家> :请求将你传送到他人 (传送至bot位置将立即传送)
      同{tpa}
    {0} askhere <玩家> :请求他人传送到你
      同{tph}
    {0} accept :同意传送请求
    {0} reject :拒绝传送请求
    {0} cancel :取消传送请求
    {0} warp <坐标点> :传送到坐标点
    {0} warps list [页] :列出此页中的坐标点
    {0} warps search <关键词> [页] :列出此页中匹配关键词的坐标点
    {0} warps add <坐标点> <x> <y> <z> <维度> :添加或设置坐标点
    {0} warps addhere <坐标点> :在当前位置添加或设置坐标点
    {0} warps remove <坐标点> :删除坐标点
    {0} warps rename <坐标点> <新名称> :重命名一个坐标点
    {0} warps disown <坐标点> :无所有权化一个坐标点
    {0} warps alias <别名> <原坐标点> :创建一个坐标点的别名
    {0} warps rmalias <别名> :删除一个坐标点的别名，而不是直接删除该坐标点
  ask:
    spb: '传送至特殊bot可能会造成意外的死亡事件等，请使用`!!tp confirm`以确认传送'
    unknownrequest: '未知传送请求'
    sending: '您的传送请求已发送给{0}...'
    aborted: '您的传送请求已终止'
    timeout: '您的传送请求已超时'
    request_to: '玩家{0}请求传送到您'
    request_from: '玩家{0}请求您传送到他'
    player_req_exists: '玩家{0}已经有传送请求了'
    req_exists: '你已经有传送请求了'
    cooldown: '传送冷却中, 剩余{0}秒'
    player_not_online: '[WARN] 玩家 {0} 不在线'
    invalid_position: '坐标中存在无效字符 ({err})'
  word:
